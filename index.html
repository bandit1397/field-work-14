<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>현장 업무처리 14종</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100vh;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .section {
      margin-bottom: 2rem;
      background: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    button {
      display: block;
      margin: 0.5rem 0;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }

    .sub-content {
      margin-left: 1rem;
      margin-top: 0.5rem;
      background: #eef;
      padding: 0.5rem;
      border-radius: 4px;
    }

    #feedback-btn {
      margin: 0.3rem auto;
    }

    /* 매뉴얼 화면: 표지 스플래시 없이 바로 표시 */
    #manual-screen {
      padding: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }

    ul, li {
      list-style-type: none !important;
      margin: 0;
      padding: 0;
    }

    li::before { content: none !important; }
    li::marker { content: none !important; }

    .highlight { color: blue; font-weight: bold; }

    .flow {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .flow .step {
      border: 1px dashed #888;
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
      background: #fafafa;
    }

    .flow .arrow { color: #d21f27; font-weight: bold; }

    /* 이미지 모달 */
    .doc-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1200;
      background: rgba(0, 0, 0, 0.6);
    }

    .doc-modal.open { display: flex; }

    .doc-modal .box {
      width: 94%;
      max-width: 1000px;
      height: 90%;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .doc-modal .header {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .doc-modal .header .title { font-weight: 600; }

    .doc-modal .content {
      flex: 1;
      background: #333;
      overflow: auto;
      padding: 8px;
      text-align: center;
    }

    .doc-modal .content img {
      max-width: 100%;
      height: auto;
    }

    .link-button {
      border: 1px solid #ccc;
      background: #f6f6f6;
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      color: #111;
    }

    .hidden { display: none; }

    .notice-box {
      background: #fff7e6;
      border: 1px solid #ffd591;
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      color: #663c00;
      margin-top: 0.6rem;
    }
  </style>
</head>

<body>

  </div>

</div>

    </div>
    <div class="content" id="docContent"></div>
  </div>
</div>

  return text

/* ===== UI 렌더링 ===== */
function 글자크기적용(text, depth) {
  if (depth === 0) return `<span style="font-size:0.95em;">${text}</span>`;
  if (depth === 0.5) return `<span style="font-size:0.88em;">${text}</span>`;
  if (depth === 1) return `<span style="font-size:0.85em;">${text}</span>`;
  if (depth === 1.5) return `<span style="font-size:0.8em;">${text}</span>`;
  if (depth === 2) return `<span style="font-size:0.75em;">${text}</span>`;
  return text;
}

function applyTextTransforms(text, depth) {
  return 글자크기적용(색상변환(text), depth);
}

function clearSubContents() {
  document.querySelectorAll('.sub-content').forEach(el => el.remove());
}

function createSubContentDepth(사건, 항목) {
  const 내용Div = document.createElement('div');
  내용Div.className = 'sub-content';
  const ul = document.createElement('ul');

  const 항목내용 = 세부내용Depth[사건]?.[항목] || [];
  항목내용.forEach(item => {
    const li = document.createElement('li');
    li.style.paddingLeft = `${item.depth * 20}px`;
    li.style.paddingTop = '2px';
    li.style.lineHeight = '1.6';
    li.innerHTML = applyTextTransforms(item.text, item.depth);
    ul.appendChild(li);
  });

  내용Div.appendChild(ul);
  return 내용Div;
}

let currentPart = null;
let currentEvent = null;

/* ----- PART 선택 ----- */
document.querySelectorAll('input[name="part"]').forEach(radio => {
  radio.addEventListener('change', () => {
    currentPart = radio.value;
    currentEvent = null;
    const 정보 = 파트정보[currentPart];

    document.getElementById('파트부제').textContent = 정보.부제;

    // 1. 절차 선택 라디오 구성
    const 절차영역 = document.getElementById('절차선택영역');
    절차영역.innerHTML = '';
    정보.절차.forEach(항목 => {
      const label = document.createElement('label');
      label.style.display = 'block';
      label.style.margin = '0.3rem 0';
      label.innerHTML =
        `<input type="radio" name="사건" value="${항목.value}"> ${항목.label}`;
      절차영역.appendChild(label);
    });
    바인드사건라디오();
    document.getElementById('절차선택섹션').classList.remove('hidden');

    // 2. 세부 항목 초기화
    document.getElementById('세부항목버튼영역').innerHTML = '';
    document.getElementById('세부항목섹션').classList.add('hidden');
    clearSubContents();

    // 3. 필수서류 섹션 노출
    document.getElementById('필수서류섹션').classList.remove('hidden');

    // 4. 원본 자료 버튼 구성
    const 원본영역 = document.getElementById('원본버튼영역');
    원본영역.innerHTML = '';
    정보.원본.forEach(자료 => {
      const btn = document.createElement('button');
      btn.dataset.scan = 자료.file;
      btn.textContent = 자료.label;
      원본영역.appendChild(btn);
    });
    document.getElementById('원본섹션').classList.remove('hidden');
  });
});

/* ----- 절차(사건) 선택 ----- */
function 바인드사건라디오() {
  document.querySelectorAll('input[name="사건"]').forEach(radio => {
    radio.addEventListener('change', () => {
      const 사건 = radio.value;
      currentEvent = 사건;
      const 세부버튼영역 = document.getElementById('세부항목버튼영역');
      세부버튼영역.innerHTML = '';
      clearSubContents();
      const 항목들 = Object.keys(세부내용Depth[사건])
        .filter(항목 => 항목 !== "필수서류");
      항목들.forEach(항목 => {
        const btn = document.createElement('button');
        btn.innerHTML = 색상변환(항목);
        btn.addEventListener('click', () => {
          clearSubContents();
          const 내용 = createSubContentDepth(사건, 항목);
          btn.insertAdjacentElement('afterend', 내용);
        });
        세부버튼영역.appendChild(btn);
      });
      document.getElementById('세부항목섹션').classList.remove('hidden');
    });
  });
}

document.querySelectorAll('#필수서류버튼영역 button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!currentEvent) { alert("먼저 절차를 선택해주세요."); return; }
    clearSubContents();
    const 내용 = createSubContentDepth(currentEvent, btn.dataset.항목);
    btn.insertAdjacentElement('afterend', 내용);
  });
});

/* ===== 원본 이미지 모달 ===== */
const modal = document.getElementById('docModal');
const docTitle = document.getElementById('docTitle');
const docContent = document.getElementById('docContent');
const docDownload = document.getElementById('docDownload');
const docClose = document.getElementById('docClose');

docClose.addEventListener('click', closeDocumentModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeDocumentModal(); });

document.getElementById('원본버튼영역').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-scan]');
  if (!btn) return;
  const src = btn.dataset.scan;
  docTitle.textContent = btn.textContent.trim();
  docContent.innerHTML = '';
  const img = document.createElement('img');
  img.src = src;
  img.alt = btn.textContent.trim();
  docContent.appendChild(img);
  docDownload.href = src;
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
});

function closeDocumentModal() {
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
}
